<p>todo-list works!</p>



<div class="todo-container">
  <h2>
  My To-Do List
  </h2>
  <input [(ngModel)]="newTask" placeholder="New Task"
    (keyup.enter)="addTask()"
  />

  <button (click)="addTask()">Add Task</button>

  <p *ngIf="tasks.length === 0">No tasks available. Please add a task.</p>
  <!-- so above is common modules directive makes it available only if above is true -->
  <ul>
    <li *ngFor="let task of tasks; let i = index">
      {{ task }}
      <button (click)="removeTask(i)">Remove</button>
    </li>
    <!-- added readme -->
  </ul>


</div>
